name: Agent changelog update

on:
  push:
    branches:
      - agent/fix-reinstall-indexing-hang

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5

      - name: Update coding-agent changelog
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'packages/coding-agent/CHANGELOG.md';
          const source = fs.readFileSync(file, 'utf8');
          const unreleasedStart = source.indexOf('## [Unreleased]');
          const nextRelease = source.indexOf('\n## [', unreleasedStart + 1);
          if (unreleasedStart < 0 || nextRelease < 0) throw new Error('Unable to locate Unreleased changelog section');
          const before = source.slice(0, unreleasedStart);
          let section = source.slice(unreleasedStart, nextRelease);
          const after = source.slice(nextRelease);
          const entries = [
            '- Bound code-index reinstall quiescence waits, stop a validated daemon that cannot settle promptly, and defer service-manager restarts until the reinstall marker is cleared.',
            '- Keep global `p` relinking quiet by disabling npm audit/funding summaries while preserving command failures.',
          ];
          const heading = '### Fixed\n\n';
          const headingIndex = section.indexOf(heading);
          if (headingIndex < 0) throw new Error('Unable to locate Unreleased Fixed subsection');
          const missing = entries.filter((entry) => !section.includes(entry));
          if (missing.length > 0) {
            const insertion = `${heading}${missing.join('\n')}\n`;
            section = section.slice(0, headingIndex) + insertion + section.slice(headingIndex + heading.length);
            fs.writeFileSync(file, before + section + after);
          }
          NODE

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/coding-agent/CHANGELOG.md
          git commit -m "docs(coding-agent): document reinstall fixes"
          git push origin HEAD:agent/fix-reinstall-indexing-hang
