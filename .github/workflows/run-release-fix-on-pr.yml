name: Run release changelog fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/fix-release-changelog-order' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-release-changelog-order
          fetch-depth: 0

      - name: Apply prepared anchored edits
        run: |
          awk '
            /^          cat > \/tmp\/apply-release-fix.mjs/ { capture = 1; next }
            capture && /^          EOF$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-release-changelog-fix.yml > /tmp/apply-release-fix.mjs
          node /tmp/apply-release-fix.mjs
          rm .github/workflows/run-release-fix-on-pr.yml

      - name: Validate edits
        run: |
          node --check scripts/release.mjs
          node - <<'EOF'
          const { readFileSync } = require('node:fs');
          for (const path of ['packages/agent/CHANGELOG.md', 'packages/coding-agent/CHANGELOG.md']) {
            const content = readFileSync(path, 'utf8');
            if (!content.startsWith('# Changelog\n\n## [Unreleased]\n\n## [0.4.41] - 2026-07-23')) {
              throw new Error(`${path}: corrected release order missing`);
            }
          }
          EOF

      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AGENTS.md scripts/release.mjs packages/agent/CHANGELOG.md packages/coding-agent/CHANGELOG.md .github/workflows/apply-release-changelog-fix.yml .github/workflows/run-release-fix-on-pr.yml
          git commit -m "fix: validate release changelog structure"
          git push origin HEAD:agent/fix-release-changelog-order
