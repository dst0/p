name: Apply finish_work regression expectation fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fix regression expectation
        run: |
          python scripts/fix-finish-work-validation-regression.py
          rm scripts/fix-finish-work-validation-regression.py
          rm .github/workflows/diagnose-finish-work-test.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix finish_work validation regression expectation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
