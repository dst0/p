name: Apply code RAG fixes

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply patch
        run: |
          set +e
          git apply --verbose --recount .github/patches/fix-code-rag-retrieval.patch > .github/code-rag-patch-diagnostics.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cat .github/code-rag-patch-diagnostics.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/code-rag-patch-diagnostics.log
            git commit -m "chore: capture code RAG patch diagnostics"
            git push origin HEAD
            exit "$status"
          fi
          rm .github/code-rag-patch-diagnostics.log
          rm .github/patches/fix-code-rag-retrieval.patch
          rm .github/workflows/apply-code-rag-fixes.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting and types
        run: npm run check

      - name: Run code-index tests
        run: npm test --workspace @dst0/p-code-index

      - name: Validate Python embedding server
        run: python3 -m py_compile packages/code-index/embedding_server.py

      - name: Verify patch cleanliness
        run: git diff --check

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(code-index): harden semantic retrieval indexing"
          git push origin HEAD
