name: Apply code RAG fixes

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch pull request branch
        run: |
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${HEAD_REF}"
          git checkout -q -B "${HEAD_REF}" FETCH_HEAD

      - name: Apply deterministic migration
        run: |
          python3 .github/scripts/apply-code-rag-fixes.py
          rm .github/patches/fix-code-rag-retrieval.patch
          rm .github/scripts/apply-code-rag-fixes.py
          rm .github/workflows/apply-code-rag-fixes.yml

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting and types
        run: npm run check

      - name: Run code-index tests
        run: npm test --workspace @dst0/p-code-index

      - name: Validate Python embedding server
        run: python3 -m py_compile packages/code-index/embedding_server.py

      - name: Verify patch cleanliness
        run: git diff --check

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(code-index): harden semantic retrieval indexing"
          git push origin HEAD
