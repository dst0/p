name: Diagnose finish_work event result

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build monorepo
        run: npm run build

      - name: Instrument focused regression
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('packages/coding-agent/test/suite/regressions/finish-work-auto-prepend.test.ts')
          text = path.read_text()
          old = '''\t\t\tconst finishEnds = toolEndEvents(harness, "finish_work");
\t\t\texpect(finishEnds).toHaveLength(1);'''
          new = '''\t\t\tconst finishEnds = toolEndEvents(harness, "finish_work");
\t\t\tconsole.error("FINISH_ENDS_DEBUG", JSON.stringify(finishEnds, null, 2));
\t\t\texpect(finishEnds).toHaveLength(1);'''
          if text.count(old) < 1:
              raise SystemExit('instrumentation target not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Run focused regression test
        id: test
        continue-on-error: true
        run: npx vitest --run packages/coding-agent/test/suite/regressions/finish-work-auto-prepend.test.ts > /tmp/finish-work-debug.log 2>&1

      - name: Report event payload
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'Instrumented finish_work event result:'
            echo
            echo '```text'
            sed -n '/FINISH_ENDS_DEBUG/,$p' /tmp/finish-work-debug.log | tail -n 180
            echo '```'
          } > /tmp/comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/comment.md

      - name: Preserve failure status
        if: steps.test.outcome == 'failure'
        run: exit 1
