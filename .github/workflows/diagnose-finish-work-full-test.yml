name: Diagnose finish_work coding-agent tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build monorepo
        run: npm run build

      - name: Run coding-agent test suite
        id: test
        continue-on-error: true
        run: npm --prefix packages/coding-agent test > /tmp/coding-agent-test.log 2>&1

      - name: Report coding-agent result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'Coding-agent test failure summary:'
            echo
            echo '```text'
            grep -n -E 'FAIL|Failed Tests|Failed Suites|AssertionError|Error:|Test Files|Tests ' /tmp/coding-agent-test.log | tail -n 240 || true
            echo
            echo '--- final output ---'
            tail -n 120 /tmp/coding-agent-test.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/comment.md

      - name: Preserve failure status
        if: steps.test.outcome == 'failure'
        run: exit 1
