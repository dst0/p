name: Apply finish_work reconciliation fix on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply reviewed fix
        run: |
          awk '
            /^          python <<'"'"'PY'"'"'$/ { capture = 1; next }
            /^          PY$/ { capture = 0 }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-finish-work-reconciliation-fix.yml > /tmp/apply-finish-work-fix.py
          python /tmp/apply-finish-work-fix.py
          rm .github/workflows/apply-finish-work-reconciliation-fix.yml
          rm .github/workflows/apply-finish-work-reconciliation-on-pr.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix finish_work reconciliation timing"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
