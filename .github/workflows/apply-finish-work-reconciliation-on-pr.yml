name: Apply finish_work reconciliation fix on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Finalize reviewed fix
        id: apply
        continue-on-error: true
        run: |
          python scripts/finalize-finish-work-reconciliation-fix.py > /tmp/apply-finish-work.log 2>&1

      - name: Report patch failure
        if: steps.apply.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'Temporary patch bootstrap failed with:'
            echo
            echo '```text'
            cat /tmp/apply-finish-work.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/comment.md
          exit 1

      - name: Remove bootstrap files
        if: steps.apply.outcome == 'success'
        run: |
          rm scripts/apply-finish-work-reconciliation-fix.py
          rm scripts/finalize-finish-work-reconciliation-fix.py
          rm .github/workflows/apply-finish-work-reconciliation-fix.yml
          rm .github/workflows/apply-finish-work-reconciliation-on-pr.yml

      - name: Commit fix
        if: steps.apply.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix finish_work reconciliation timing"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
