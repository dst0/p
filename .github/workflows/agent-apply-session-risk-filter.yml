name: Apply session risk filter patch

on:
  push:
    branches:
      - agent/ignore-post-compaction-risk

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/ignore-post-compaction-risk

      - name: Apply focused patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("packages/coding-agent/src/core/compaction/structured-state.ts")
          source = source_path.read_text()

          replacements = [
              (
                  'const MAX_REQUEST_SUMMARY_CHARS = 280;\n',
                  '''const MAX_REQUEST_SUMMARY_CHARS = 280;\nconst IGNORED_SESSION_STATE_RISK_PREFIXES = ["post-compaction context exceeds target"] as const;\n\nfunction filterSessionStateRisks(risks: readonly string[] | undefined): string[] {\n\treturn (risks ?? []).filter((risk) => {\n\t\tconst normalized = compactWhitespace(risk).toLowerCase();\n\t\treturn !IGNORED_SESSION_STATE_RISK_PREFIXES.some((prefix) => normalized.startsWith(prefix));\n\t});\n}\n''',
              ),
              (
                  'knownRisks: [...previous.audit.knownRisks],',
                  'knownRisks: filterSessionStateRisks(previous.audit.knownRisks),',
              ),
              (
                  'knownRisks: mergeStringList(next.audit.knownRisks, patch.audit.knownRisks),',
                  'knownRisks: filterSessionStateRisks(mergeStringList(next.audit.knownRisks, patch.audit.knownRisks)),',
              ),
              (
                  'const knownRisks = state.audit.knownRisks.map((risk) => `${STATE_RENDER_MARKERS.risk} ${capPromptLine(risk, 220)}`);',
                  'const knownRisks = filterSessionStateRisks(state.audit.knownRisks).map(\n\t\t(risk) => `${STATE_RENDER_MARKERS.risk} ${capPromptLine(risk, 220)}`,\n\t);',
              ),
              (
                  'const risks = state.audit.knownRisks.map((risk) => `${STATE_RENDER_MARKERS.risk} ${capPromptLine(risk, 220)}`);',
                  'const risks = filterSessionStateRisks(state.audit.knownRisks).map(\n\t\t(risk) => `${STATE_RENDER_MARKERS.risk} ${capPromptLine(risk, 220)}`,\n\t);',
              ),
              (
                  'state.audit.knownRisks.length > 0',
                  'filterSessionStateRisks(state.audit.knownRisks).length > 0',
              ),
              (
                  'const risks = getStringListField(value, ["risks", "knownRisks", "known_risks"]);',
                  'const risks = filterSessionStateRisks(getStringListField(value, ["risks", "knownRisks", "known_risks"]));',
              ),
              (
                  'knownRisks: mergeStringList(existing.audit?.knownRisks ?? [], incoming.audit?.knownRisks),',
                  'knownRisks: filterSessionStateRisks(\n\t\t\t\t\t\t\tmergeStringList(existing.audit?.knownRisks ?? [], incoming.audit?.knownRisks),\n\t\t\t\t\t\t),',
              ),
              (
                  'knownRisks: input.audit?.risks ?? [],',
                  'knownRisks: filterSessionStateRisks(input.audit?.risks),',
              ),
              (
                  'previous.audit.knownRisks.length > 0',
                  'filterSessionStateRisks(previous.audit.knownRisks).length > 0',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence of {old!r}, found {count}")
              source = source.replace(old, new, 1)

          source_path.write_text(source)

          test_path = Path("packages/coding-agent/test/structured-state-risk-filter.test.ts")
          test_path.write_text('''import { describe, expect, it } from "vitest";\nimport {\n\tcreateInitialStructuredSessionState,\n\tcreateStructuredSessionState,\n\tmergeStructuredSessionState,\n\tparseSessionStateUpdateBlock,\n\trenderStructuredSessionCheckpoint,\n\trenderWorkingSessionState,\n} from "../src/core/compaction/index.ts";\n\nconst IGNORED_RISK = "post-compaction context exceeds target";\nconst REAL_RISK = "release validation is still pending";\n\ndescribe("structured session-state risk filtering", () => {\n\tit("drops the post-compaction target diagnostic while retaining real risks", () => {\n\t\tconst previous = createInitialStructuredSessionState("session");\n\t\tprevious.audit.knownRisks = [IGNORED_RISK, REAL_RISK];\n\n\t\tconst state = mergeStructuredSessionState(previous, {\n\t\t\taudit: { knownRisks: [`${IGNORED_RISK} (12000 > 10000)`, "another real risk"] },\n\t\t});\n\n\t\texpect(state.audit.knownRisks).toEqual([REAL_RISK, "another real risk"]);\n\t});\n\n\tit("filters the diagnostic from model-provided state updates", () => {\n\t\tconst parsed = parseSessionStateUpdateBlock(\n\t\t\t`<session_state_update>{"type":"patch","risks":["${IGNORED_RISK}","${REAL_RISK}"]}</session_state_update>`,\n\t\t);\n\t\tconst state = mergeStructuredSessionState(createInitialStructuredSessionState("session"), parsed.patch!);\n\n\t\texpect(state.audit.knownRisks).toEqual([REAL_RISK]);\n\t});\n\n\tit("filters compaction audit diagnostics before persisting structured state", () => {\n\t\tconst state = createStructuredSessionState({\n\t\t\tsessionId: "session",\n\t\t\tsummary: "## Goal\\nKeep useful session risks",\n\t\t\tentries: [],\n\t\t\taudit: {\n\t\t\t\tbeforeTokens: 20000,\n\t\t\t\tafterTokens: 12000,\n\t\t\t\tsavedTokens: 8000,\n\t\t\t\tsummaryTokens: 1000,\n\t\t\t\trenderedStateTokens: 1000,\n\t\t\t\trecentRawTokens: 11000,\n\t\t\t\ttoolRawTokens: 0,\n\t\t\t\ttoolStubTokens: 0,\n\t\t\t\tdroppedEntries: [],\n\t\t\t\tstubbedToolResults: [],\n\t\t\t\trisks: [IGNORED_RISK, REAL_RISK],\n\t\t\t},\n\t\t});\n\n\t\texpect(state.audit.knownRisks).toEqual([REAL_RISK]);\n\t});\n\n\tit("never renders a stale persisted diagnostic", () => {\n\t\tconst state = createInitialStructuredSessionState("session");\n\t\tstate.canonicalRequest.current = "Continue the task";\n\t\tstate.audit.knownRisks = [IGNORED_RISK, REAL_RISK];\n\n\t\tconst checkpoint = renderStructuredSessionCheckpoint(state, 4000);\n\t\tconst workingState = renderWorkingSessionState(state, 4000);\n\n\t\texpect(checkpoint).not.toContain(IGNORED_RISK);\n\t\texpect(workingState).not.toContain(IGNORED_RISK);\n\t\texpect(checkpoint).toContain(REAL_RISK);\n\t\texpect(workingState).toContain(REAL_RISK);\n\t});\n});\n''')
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run focused tests
        run: npx vitest run packages/coding-agent/test/structured-state-risk-filter.test.ts

      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/agent-apply-session-risk-filter.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/coding-agent/src/core/compaction/structured-state.ts \
            packages/coding-agent/test/structured-state-risk-filter.test.ts \
            .github/workflows/agent-apply-session-risk-filter.yml
          git commit -m "Ignore compaction budget diagnostics in session risks"
          git push origin HEAD:agent/ignore-post-compaction-risk
