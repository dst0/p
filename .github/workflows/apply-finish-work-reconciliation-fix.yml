name: Apply finish_work reconciliation fix

on:
  push:
    branches:
      - agent/fix-finish-work-reconciliation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-finish-work-reconciliation
          fetch-depth: 0

      - name: Apply reviewed fix
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          session_path = Path("packages/coding-agent/src/core/agent-session.ts")
          session = session_path.read_text()

          session = replace_once(
              session,
              '''\t\t\tif (toolCall.name === FINISH_WORK_TOOL_NAME) {
          \t\t\t\tconst status = getFinishWorkStatus(args);
          \t\t\t\tif (status === "success") {
          \t\t\t\t\tthis._reconcileSuccessfulFinishWorkState();
          \t\t\t\t}
          \t\t\t\tconst blockReason = this._getFinishWorkSessionStateBlockReason(args);
          \t\t\t\tif (blockReason) {
          \t\t\t\t\tthis._autoExecuteUpdateSessionStateForFinishWork();
          \t\t\t\t\tif (status === "success") {
          \t\t\t\t\t\tthis._reconcileSuccessfulFinishWorkState();
          \t\t\t\t\t}
          \t\t\t\t\tconst updatedBlockReason = this._getFinishWorkSessionStateBlockReason(args);
          \t\t\t\t\tif (updatedBlockReason) {
          \t\t\t\t\t\treturn { block: true, reason: updatedBlockReason };
          \t\t\t\t\t}
          \t\t\t\t}
          \t\t\t}''',
              '''\t\t\tif (toolCall.name === FINISH_WORK_TOOL_NAME) {
          \t\t\t\tconst blockReason = this._getFinishWorkSessionStateBlockReason(args);
          \t\t\t\tif (blockReason) {
          \t\t\t\t\tthis._autoExecuteUpdateSessionStateForFinishWork();
          \t\t\t\t\tconst updatedBlockReason = this._getFinishWorkSessionStateBlockReason(args);
          \t\t\t\t\tif (updatedBlockReason) {
          \t\t\t\t\t\treturn { block: true, reason: updatedBlockReason };
          \t\t\t\t\t}
          \t\t\t\t}
          \t\t\t}''',
              "remove pre-execution reconciliation",
          )

          session = replace_once(
              session,
              '''\t\t\t} else if (!nextIsError && toolCall.name !== SLEEP_TOOL_NAME && toolCall.name !== FINISH_WORK_TOOL_NAME) {
          \t\t\t\tthis._progressUpdateRequiredBeforeFinish = true;
          \t\t\t}

          \t\t\tif (!changed) {''',
              '''\t\t\t} else if (!nextIsError && toolCall.name !== SLEEP_TOOL_NAME && toolCall.name !== FINISH_WORK_TOOL_NAME) {
          \t\t\t\tthis._progressUpdateRequiredBeforeFinish = true;
          \t\t\t}

          \t\t\tif (
          \t\t\t\ttoolCall.name === FINISH_WORK_TOOL_NAME &&
          \t\t\t\tgetFinishWorkStatus(args) === "success" &&
          \t\t\t\t!nextIsError
          \t\t\t) {
          \t\t\t\tthis._reconcileSuccessfulFinishWorkState();
          \t\t\t}

          \t\t\tif (!changed) {''',
              "add post-execution reconciliation",
          )

          old_gate = '''\tprivate _getFinishWorkSessionStateBlockReason(args: unknown): string | undefined {
          \t\tconst state =
          \t\t\tgetLatestStructuredSessionState(this.sessionManager.getBranch()) ??
          \t\t\treadSessionStateFile(this._cwd, this.sessionManager.getSessionId());
          \t\tif (!state) {
          \t\t\treturn undefined;
          \t\t}
          \t\tconst openItems = getOpenSessionStateItems(state);
          \t\tif (openItems.length === 0) {
          \t\t\treturn undefined;
          \t\t}

          \t\tconst status = getFinishWorkStatus(args);
          \t\tconst remainingWork = getFinishWorkRemainingWork(args);
          \t\tif ((status === "partial" || status === "failed") && remainingWork.length > 0) {
          \t\t\treturn undefined;
          \t\t}

          \t\tconst preview = openItems
          \t\t\t.slice(0, 8)
          \t\t\t.map((item) => `- ${item}`)
          \t\t\t.join("\\n");
          \t\tconst suffix = openItems.length > 8 ? `\\n- ...and ${openItems.length - 8} more` : "";
          \t\tif (status === "partial" || status === "failed") {
          \t\t\treturn (
          \t\t\t\t`Cannot call ${FINISH_WORK_TOOL_NAME} with status "${status}" while session state has unresolved work ` +
          \t\t\t\t`unless remaining_work lists what is still unfinished:\\n${preview}${suffix}`
          \t\t\t);
          \t\t}
          \t\treturn (
          \t\t\t`Cannot call ${FINISH_WORK_TOOL_NAME} with status "${status ?? "success"}" while session state has ` +
          \t\t\t`unresolved work:\\n${preview}${suffix}\\n` +
          \t\t\t`Do not retry ${FINISH_WORK_TOOL_NAME} until a state-changing tool call succeeds. Call ` +
          \t\t\t`${MARK_SESSION_PROGRESS_TOOL_NAME} for completed existing items, call ${UPDATE_SESSION_STATE_TOOL_NAME} ` +
          \t\t\t`with action "replan" if the scope changed, or finish with status "partial" and remaining_work.`
          \t\t);
          \t}'''
          new_gate = '''\tprivate _getFinishWorkSessionStateBlockReason(args: unknown): string | undefined {
          \t\tconst state =
          \t\t\tgetLatestStructuredSessionState(this.sessionManager.getBranch()) ??
          \t\t\treadSessionStateFile(this._cwd, this.sessionManager.getSessionId());
          \t\tif (!state) {
          \t\t\treturn undefined;
          \t\t}

          \t\tconst status = getFinishWorkStatus(args);
          \t\tconst openItems =
          \t\t\tstatus === "success"
          \t\t\t\t? state.plan
          \t\t\t\t\t\t.filter((item) => item.status === "failed" || item.status === "blocked")
          \t\t\t\t\t\t.map((item) => `${item.text} (${item.status})`)
          \t\t\t\t: getOpenSessionStateItems(state);
          \t\tif (openItems.length === 0) {
          \t\t\treturn undefined;
          \t\t}

          \t\tconst remainingWork = getFinishWorkRemainingWork(args);
          \t\tif ((status === "partial" || status === "failed") && remainingWork.length > 0) {
          \t\t\treturn undefined;
          \t\t}

          \t\tconst preview = openItems
          \t\t\t.slice(0, 8)
          \t\t\t.map((item) => `- ${item}`)
          \t\t\t.join("\\n");
          \t\tconst suffix = openItems.length > 8 ? `\\n- ...and ${openItems.length - 8} more` : "";
          \t\tif (status === "partial" || status === "failed") {
          \t\t\treturn (
          \t\t\t\t`Cannot call ${FINISH_WORK_TOOL_NAME} with status "${status}" while session state has unresolved work ` +
          \t\t\t\t`unless remaining_work lists what is still unfinished:\\n${preview}${suffix}`
          \t\t\t);
          \t\t}
          \t\treturn (
          \t\t\t`Cannot call ${FINISH_WORK_TOOL_NAME} with status "${status ?? "success"}" while session state has ` +
          \t\t\t`unresolved work:\\n${preview}${suffix}\\n` +
          \t\t\t`Do not retry ${FINISH_WORK_TOOL_NAME} until a state-changing tool call succeeds. Call ` +
          \t\t\t`${MARK_SESSION_PROGRESS_TOOL_NAME} for completed existing items, call ${UPDATE_SESSION_STATE_TOOL_NAME} ` +
          \t\t\t`with action "replan" if the scope changed, or finish with status "partial" and remaining_work.`
          \t\t);
          \t}'''
          session = replace_once(session, old_gate, new_gate, "relax success gate")
          session_path.write_text(session)

          prompt_path = Path("packages/coding-agent/src/core/system-prompt.ts")
          prompt = prompt_path.read_text()
          prompt = replace_once(
              prompt,
              '''\t\t`Examine the <working_state> block to check current plan items and their statuses.`,
          \t\t"Only call finish_work with status 'success' when all plan items are genuinely done — if any item is still not_started, in_progress, failed, or blocked, complete the remaining work first or use status 'partial'/'failed' with remaining_work explained.",
          \t\t"If plan items are incomplete, do the remaining work, update session state to reflect progress, then reconsider finish_work.",
          \t\t"Repeat this check — review state, do remaining work, update state — until all tasks are genuinely complete before calling finish_work with status 'success'.",''',
              '''\t\t`Examine the <working_state> block to check current plan items and their statuses.`,
          \t\t"Call finish_work with status 'success' only when the requested work is genuinely complete. A successful call automatically reconciles stale not_started or in_progress plan statuses; failed or blocked items must be resolved, or reported with status 'partial'/'failed' and remaining_work.",''',
              "align completion prompt",
          )
          prompt_path.write_text(prompt)

          test_path = Path("packages/coding-agent/test/suite/regressions/finish-work-auto-prepend.test.ts")
          tests = test_path.read_text()
          insert = r'''

          \tit("does not reconcile when a success payload fails validation", async () => {
          \t\tconst harness = await createHarness();
          \t\ttry {
          \t\t\tharness.setResponses([
          \t\t\t\tfauxAssistantMessage(updateStateCall("Do all tracked work"), { stopReason: "toolUse" }),
          \t\t\t\tfauxAssistantMessage(
          \t\t\t\t\tfinishCall("invalid success", {
          \t\t\t\t\t\tremainingWork: ["Inspect the requested file"],
          \t\t\t\t\t}),
          \t\t\t\t\t{ stopReason: "toolUse" },
          \t\t\t\t),
          \t\t\t\tfauxAssistantMessage(
          \t\t\t\t\tfinishCall("partially complete", {
          \t\t\t\t\t\tstatus: "partial",
          \t\t\t\t\t\tremainingWork: ["Inspect the requested file"],
          \t\t\t\t\t}),
          \t\t\t\t\t{ stopReason: "toolUse" },
          \t\t\t\t),
          \t\t\t]);

          \t\t\tawait harness.session.prompt("Do all tracked work");

          \t\t\tconst finishEnds = toolEndEvents(harness, "finish_work");
          \t\t\texpect(finishEnds).toHaveLength(2);
          \t\t\texpect(finishEnds[0]?.isError).toBe(true);
          \t\t\texpect(JSON.stringify(finishEnds[0]?.result.content)).toContain("validation error");
          \t\t\texpect(finishEnds[1]?.isError).toBe(false);

          \t\t\tconst state = getLatestStructuredSessionState(harness.sessionManager.getEntries());
          \t\t\texpect(state?.plan.map((item) => [item.text, item.status])).toEqual([
          \t\t\t\t["Inspect the requested file", "in_progress"],
          \t\t\t]);
          \t\t} finally {
          \t\t\tharness.cleanup();
          \t\t}
          \t});

          \tit("does not reconcile auto-completable items when another item blocks success", async () => {
          \t\tconst harness = await createHarness();
          \t\ttry {
          \t\t\tharness.setResponses([
          \t\t\t\tfauxAssistantMessage(
          \t\t\t\t\tfauxToolCall(UPDATE_TOOL, {
          \t\t\t\t\t\taction: "initial_plan",
          \t\t\t\t\t\tgoal: "Do all tracked work",
          \t\t\t\t\t\tplan: [
          \t\t\t\t\t\t\t{ text: "Implement the change", status: "in_progress" },
          \t\t\t\t\t\t\t{ text: "Run verification", status: "failed" },
          \t\t\t\t\t\t],
          \t\t\t\t\t}),
          \t\t\t\t\t{ stopReason: "toolUse" },
          \t\t\t\t),
          \t\t\t\tfauxAssistantMessage(finishCall("done anyway"), { stopReason: "toolUse" }),
          \t\t\t\tfauxAssistantMessage(
          \t\t\t\t\tfinishCall("partially complete", {
          \t\t\t\t\t\tstatus: "partial",
          \t\t\t\t\t\tremainingWork: ["Implement the change", "Run verification"],
          \t\t\t\t\t}),
          \t\t\t\t\t{ stopReason: "toolUse" },
          \t\t\t\t),
          \t\t\t]);

          \t\t\tawait harness.session.prompt("Do all tracked work");

          \t\t\tconst finishEnds = toolEndEvents(harness, "finish_work");
          \t\t\texpect(finishEnds).toHaveLength(2);
          \t\t\texpect(finishEnds[0]?.isError).toBe(true);
          \t\t\texpect(finishEnds[1]?.isError).toBe(false);

          \t\t\tconst state = getLatestStructuredSessionState(harness.sessionManager.getEntries());
          \t\t\texpect(state?.plan.map((item) => [item.text, item.status])).toEqual([
          \t\t\t\t["Implement the change", "in_progress"],
          \t\t\t\t["Run verification", "failed"],
          \t\t\t]);
          \t\t} finally {
          \t\t\tharness.cleanup();
          \t\t}
          \t});'''
          marker = "\n});"
          if tests.count(marker) < 1:
              raise SystemExit("test insertion marker not found")
          head, tail = tests.rsplit(marker, 1)
          test_path.write_text(head + insert + marker + tail)
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/coding-agent/src/core/agent-session.ts packages/coding-agent/src/core/system-prompt.ts packages/coding-agent/test/suite/regressions/finish-work-auto-prepend.test.ts
          git commit -m "Fix finish_work reconciliation timing"
          git push origin HEAD:agent/fix-finish-work-reconciliation
