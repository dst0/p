name: Agent full test diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  full-test-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/fix-reinstall-indexing-hang

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Capture full test output
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/p-ci-home"
          HOME="$RUNNER_TEMP/p-ci-home" ./test.sh > "$RUNNER_TEMP/full-test.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/full-test-exit.txt"
          set -e

      - name: Upload full test output
        uses: actions/upload-artifact@v4
        with:
          name: full-test-diagnostics
          path: |
            ${{ runner.temp }}/full-test.log
            ${{ runner.temp }}/full-test-exit.txt
          if-no-files-found: error
