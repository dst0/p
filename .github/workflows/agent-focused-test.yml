name: Agent focused reinstall test

on:
  push:
    branches:
      - agent/fix-reinstall-indexing-hang

permissions:
  contents: read

jobs:
  focused-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/fix-reinstall-indexing-hang

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Capture focused test output
        run: |
          set +e
          cd packages/coding-agent
          node ../../node_modules/vitest/dist/cli.js --run test/indexing-reinstall-script.test.ts > "$RUNNER_TEMP/focused-test.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/focused-test-exit.txt"
          set -e

      - name: Upload focused test output
        uses: actions/upload-artifact@v4
        with:
          name: focused-reinstall-test
          path: |
            ${{ runner.temp }}/focused-test.log
            ${{ runner.temp }}/focused-test-exit.txt
          if-no-files-found: error
