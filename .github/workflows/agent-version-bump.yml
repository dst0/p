name: Agent version bump

on:
  push:
    branches:
      - agent/fix-reinstall-indexing-hang

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Bump patch version
        run: node scripts/version-bump.mjs patch

      - name: Commit generated version files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json \
            packages/agent/package.json \
            packages/ai/package.json \
            packages/coding-agent/package.json \
            packages/code-index/package.json \
            packages/tui/package.json \
            packages/coding-agent/examples/extensions/with-deps/package.json \
            packages/coding-agent/examples/extensions/custom-provider-anthropic/package.json \
            packages/coding-agent/examples/extensions/custom-provider-gitlab-duo/package.json \
            packages/coding-agent/examples/extensions/sandbox/package.json
          git commit -m "chore: bump version to 0.4.45"
          git push origin HEAD:agent/fix-reinstall-indexing-hang
