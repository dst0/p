name: Build Binaries

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v0.12.0)'
        required: true
        type: string

permissions: {}

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, mini-pc, p]
    outputs:
      release_sha: ${{ steps.pin_release.outputs.release_sha }}
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
          fetch-depth: 0

      - name: Pin exact remote lightweight release tag
        id: pin_release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi

          tag_ref="refs/tags/${RELEASE_TAG}"
          mapfile -t remote_matches < <(git ls-remote --refs origin "${tag_ref}")
          if [[ "${#remote_matches[@]}" -ne 1 ]]; then
            echo "Expected exactly one remote release tag ref: ${tag_ref}" >&2
            exit 1
          fi

          read -r remote_sha remote_ref <<< "${remote_matches[0]}"
          if [[ "${remote_ref}" != "${tag_ref}" || ! "${remote_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Remote release tag did not resolve exactly: ${tag_ref}" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "${remote_sha}")" != "commit" ]]; then
            echo "Release tag must be lightweight and point directly to a commit" >&2
            exit 1
          fi

          checkout_sha="$(git rev-parse 'HEAD^{commit}')"
          if [[ "${remote_sha}" != "${checkout_sha}" ]]; then
            echo "Checked-out release tag does not match the remote tag commit" >&2
            exit 1
          fi
          echo "release_sha=${remote_sha}" >> "${GITHUB_OUTPUT}"

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Verify release certificate
        run: node scripts/verify-release-certificate.js "$RELEASE_TAG"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -sf "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test all, including configured live tests
        run: npm test

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Build binaries
        run: ./scripts/build-binaries.sh

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${RELEASE_TAG}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          node scripts/release-notes.js extract --version "${VERSION}" --tag "${RELEASE_TAG}" --out /tmp/release-notes.md

      - name: Re-check pinned release tag
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/${RELEASE_TAG}"
          mapfile -t remote_matches < <(git ls-remote --refs origin "${tag_ref}")
          if [[ "${#remote_matches[@]}" -ne 1 ]]; then
            echo "Remote release tag disappeared or became ambiguous: ${tag_ref}" >&2
            exit 1
          fi
          read -r remote_sha remote_ref <<< "${remote_matches[0]}"
          if [[ "${remote_ref}" != "${tag_ref}" || "${remote_sha}" != "${RELEASE_SHA}" ]]; then
            echo "Remote release tag moved after validation: ${tag_ref}" >&2
            exit 1
          fi

      - name: Create GitHub Release and upload binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd packages/coding-agent/binaries

          release_assets=(
            pi-darwin-arm64.tar.gz
            pi-darwin-x64.tar.gz
            pi-linux-x64.tar.gz
            pi-linux-arm64.tar.gz
            pi-windows-x64.zip
            pi-windows-arm64.zip
          )
          sha256sum "${release_assets[@]}" > SHA256SUMS
          release_assets+=(SHA256SUMS)

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file /tmp/release-notes.md
            gh release upload "${RELEASE_TAG}" "${release_assets[@]}" --clobber
          else
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file /tmp/release-notes.md \
              "${release_assets[@]}"
          fi

  publish-npm:
    runs-on: ubuntu-latest
    needs: [validate, build]
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Verify release artifacts are committed
        run: git diff --exit-code

      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@11.16.0 --ignore-scripts
          npm --version

      - name: Re-check pinned release tag
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/${RELEASE_TAG}"
          mapfile -t remote_matches < <(git ls-remote --refs origin "${tag_ref}")
          if [[ "${#remote_matches[@]}" -ne 1 ]]; then
            echo "Remote release tag disappeared or became ambiguous: ${tag_ref}" >&2
            exit 1
          fi
          read -r remote_sha remote_ref <<< "${remote_matches[0]}"
          if [[ "${remote_ref}" != "${tag_ref}" || "${remote_sha}" != "${RELEASE_SHA}" ]]; then
            echo "Remote release tag moved after validation: ${tag_ref}" >&2
            exit 1
          fi

      - name: Publish npm packages
        run: node scripts/publish.js
