name: Temporary task verification guidance patch

on:
  push:
    branches: [fix/task-verification-guidance]
    paths:
      - .github/workflows/temp-task-verification-guidance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/task-verification-guidance
          fetch-depth: 0

      - name: Apply task-verification guidance changes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/coding-agent/src/core/task-verification.ts")
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              "\ttaskSummary?: string;\n\tmutationRevision: number;",
              "\ttaskSummary?: string;\n\t/** Original user task context retained across compaction/session restore. */\n\ttaskContext?: string;\n\tmutationRevision: number;",
              "taskContext interface",
          )

          replace_once(
              '''\t\t\tdescription: "Record evidence-backed baseline and final semantic verification for mutating tasks.",\n\t\t\tpromptSnippet:\n\t\t\t\t"record_task_verification(action, ...): declare mutation intent, optionally authorize test-only baseline setup, then prove baseline and final behavior.",\n\t\t\tpromptGuidelines: [\n\t\t\t\t`Before edit, write, or mutating bash, call ${TASK_VERIFICATION_TOOL_NAME} with action "declare_task".`,''',
              '''\t\t\tdescription:\n\t\t\t\t'Record or inspect evidence-backed baseline and final semantic verification for mutating tasks. Use action "status" whenever the required next step is unclear, especially after compaction or session restore.',\n\t\t\tpromptSnippet:\n\t\t\t\t"record_task_verification(action, ...): declare mutation intent, inspect exact next requirements with action status, optionally authorize test-only baseline setup, then prove baseline and final behavior.",\n\t\t\tpromptGuidelines: [\n\t\t\t\t`Call ${TASK_VERIFICATION_TOOL_NAME} with action "status" at any time to recover the exact current requirement, eligible evidence handles, and next tool-call shape. Do this after compaction or whenever a gate is unclear.`,\n\t\t\t\t`Before edit, write, or mutating bash, call ${TASK_VERIFICATION_TOOL_NAME} with action "declare_task".`,''',
              "tool prompt",
          )

          replace_once(
              '''\t\t\t\texecute: async (_id, params) => {\n\t\t\t\t\tconst result = this.applyInput(params);\n\t\t\t\t\tif (result.status === "rejected") throw new Error(result.message);''',
              '''\t\t\t\texecute: async (_id, params) => {\n\t\t\t\t\tconst result = this.applyInput(params);\n\t\t\t\t\tif (result.status === "rejected") throw new Error(this.withGuidance(result.message));''',
              "rejected execution",
          )

          replace_once(
              '''\t\tif (!this.state.taskKind) {\n\t\t\treturn {\n\t\t\t\tblock: true,\n\t\t\t\treason: `Call ${TASK_VERIFICATION_TOOL_NAME} with action "declare_task" before mutating code.`,\n\t\t\t};\n\t\t}''',
              '''\t\tif (!this.state.taskKind) {\n\t\t\treturn this.blocked(`Call ${TASK_VERIFICATION_TOOL_NAME} with action "declare_task" before mutating code.`);\n\t\t}''',
              "undeclared gate",
          )

          replace_once(
              '''\t\t\treturn {\n\t\t\t\tblock: true,\n\t\t\t\treason: "Collect baseline evidence or authorize exact regression-test paths before implementation.",\n\t\t\t};''',
              '''\t\t\treturn this.blocked("Collect baseline evidence or authorize exact regression-test paths before implementation.");''',
              "baseline mutation gate",
          )

          replace_once(
              '''\t\t\tcase "status":\n\t\t\t\treturn this.updated(this.formatStatus());''',
              '''\t\t\tcase "status":\n\t\t\t\treturn this.updated(this.formatStatus(), false);''',
              "status action",
          )

          replace_once(
              '''\t\t\t...emptyState(),\n\t\t\ttaskKind: input.task_kind,\n\t\t\ttaskSummary,''',
              '''\t\t\t...emptyState(),\n\t\t\ttaskKind: input.task_kind,\n\t\t\ttaskSummary,\n\t\t\ttaskContext: normalizeText(this.latestUserPrompt).slice(0, 2_000) || undefined,''',
              "persist task context",
          )

          text = text.replace(
              "const taskText = `${this.latestUserPrompt}\\n${this.state.taskSummary}`;",
              "const taskText = `${this.state.taskContext ?? this.latestUserPrompt}\\n${this.state.taskSummary}`;",
          )
          if text.count("const taskText = `${this.state.taskContext ?? this.latestUserPrompt}\\n${this.state.taskSummary}`;") != 2:
              raise SystemExit("Expected two persisted taskText uses")

          replace_once(
              '''\t\tif (this.state.baseline.required && this.state.baseline.status !== "satisfied") {\n\t\t\treturn { block: true, reason: `Cannot ${action}: baseline verification is incomplete.` };\n\t\t}''',
              '''\t\tif (this.state.baseline.required && this.state.baseline.status !== "satisfied") {\n\t\t\treturn this.blocked(`Cannot ${action}: baseline verification is incomplete.`);\n\t\t}''',
              "final baseline gate",
          )

          replace_once(
              '''\t\t\treturn {\n\t\t\t\tblock: true,\n\t\t\t\treason: `Cannot ${action}: semantic verification has not passed after mutation revision ${this.state.mutationRevision}.`,\n\t\t\t};''',
              '''\t\t\treturn this.blocked(\n\t\t\t\t`Cannot ${action}: semantic verification has not passed after mutation revision ${this.state.mutationRevision}.`,\n\t\t\t);''',
              "final semantic gate",
          )

          start = text.index("\tprivate formatStatus(): string {")
          end = text.index("\tprivate updated(message: string): VerificationResult {", start)
          replacement = r'''\tprivate formatStatus(): string {
\t\tconst recentEvidence = [...this.evidence.values()]
\t\t\t.slice(-8)
\t\t\t.map(
\t\t\t\t(item) =>
\t\t\t\t\t`${item.ref}: ${item.isError ? "FAILED" : "passed"} ${item.toolName} at revision ${item.mutationRevision} — ${item.descriptor}${item.outputSummary ? ` — ${item.outputSummary}` : ""}`,
\t\t\t);
\t\treturn [
\t\t\t`Task: ${this.state.taskKind ?? "undeclared"}${this.state.taskSummary ? ` — ${this.state.taskSummary}` : ""}`,
\t\t\t`Mutation revision: ${this.state.mutationRevision}`,
\t\t\t`Baseline: ${this.state.baseline.status}`,
\t\t\t`Authorized baseline tests: ${this.state.baseline.authorizedTestPaths.join(", ") || "none"}`,
\t\t\t`Final: ${this.state.final.status}`,
\t\t\tthis.state.final.unresolvedFailures.length > 0
\t\t\t\t? `Unresolved failures: ${this.state.final.unresolvedFailures.join("; ")}`
\t\t\t\t: undefined,
\t\t\trecentEvidence.length > 0 ? `Evidence:\n- ${recentEvidence.join("\n- ")}` : "Evidence: none",
\t\t\tthis.formatNextRequirement(),
\t\t]
\t\t\t.filter((line): line is string => line !== undefined)
\t\t\t.join("\n");
\t}

\tprivate formatNextRequirement(): string {
\t\tif (!this.state.taskKind || !this.state.taskSummary) {
\t\t\treturn [
\t\t\t\t"NEXT REQUIRED ACTION: declare the task before any mutation.",
\t\t\t\t`Call ${TASK_VERIFICATION_TOOL_NAME} with:`,
\t\t\t\t'Allowed task_kind values: "bug_fix", "behavior_change", "refactor", "feature", "docs", "investigation".',
\t\t\t\t'{"action":"declare_task","task_kind":"bug_fix","task_summary":"concrete task scope and behavior"}',
\t\t\t].join("\n");
\t\t}

\t\tif (this.state.baseline.required && this.state.baseline.status !== "satisfied") {
\t\t\tconst failingEvidence = this.findEvidence(
\t\t\t\t(item) =>
\t\t\t\t\titem.mutationRevision === 0 &&
\t\t\t\t\titem.toolName === "bash" &&
\t\t\t\t\titem.isError &&
\t\t\t\t\tTEST_PATTERN.test(item.descriptor) &&
\t\t\t\t\tFOCUSED_TEST_PATTERN.test(item.descriptor),
\t\t\t);
\t\t\tconst runtimeEvidence = this.findEvidence(
\t\t\t\t(item) =>
\t\t\t\t\titem.mutationRevision === 0 &&
\t\t\t\t\titem.toolName === "bash" &&
\t\t\t\t\t!item.isError &&
\t\t\t\t\t!GENERIC_CHECK_PATTERN.test(item.descriptor) &&
\t\t\t\t\t!READ_ONLY_PATTERN.test(item.descriptor),
\t\t\t);
\t\t\tconst staticEvidence = [...this.evidence.values()].filter(
\t\t\t\t(item) => item.mutationRevision === 0 && !item.isError && STATIC_TOOLS.has(item.toolName),
\t\t\t);

\t\t\tif (failingEvidence) {
\t\t\t\treturn [
\t\t\t\t\t"NEXT REQUIRED ACTION: record the already-observed failing focused regression test as the baseline.",
\t\t\t\t\t`Exact baseline test command: ${failingEvidence.descriptor}`,
\t\t\t\t\t`Use evidence_refs: ["${failingEvidence.ref}"]`,
\t\t\t\t\t`Call ${TASK_VERIFICATION_TOOL_NAME} with:`,
\t\t\t\t\t`{"action":"record_baseline","baseline_method":"failing_regression_test","hypothesis":"why the current implementation causes this failure","conclusion":"what the failed test proves","evidence_refs":["${failingEvidence.ref}"],"unresolved_assumptions":[]}`,
\t\t\t\t].join("\n");
\t\t\t}

\t\t\tif (runtimeEvidence) {
\t\t\t\treturn [
\t\t\t\t\t"NEXT REQUIRED ACTION: record the already-observed runtime reproduction as the baseline.",
\t\t\t\t\t`Exact reproduction command: ${runtimeEvidence.descriptor}`,
\t\t\t\t\t`Use evidence_refs: ["${runtimeEvidence.ref}"]`,
\t\t\t\t\t`Call ${TASK_VERIFICATION_TOOL_NAME} with:`,
\t\t\t\t\t`{"action":"record_baseline","baseline_method":"runtime_reproduction","hypothesis":"causal explanation for the current behavior","conclusion":"what the reproduction proves","evidence_refs":["${runtimeEvidence.ref}"],"unresolved_assumptions":[]}`,
\t\t\t\t].join("\n");
\t\t\t}

\t\t\tconst taskText = `${this.state.taskContext ?? this.latestUserPrompt}\n${this.state.taskSummary}`;
\t\t\tconst highRisk = HIGH_RISK_PATTERN.test(taskText);
\t\t\tif (!highRisk && staticEvidence.length >= 2) {
\t\t\t\tconst refs = staticEvidence.slice(-2).map((item) => item.ref);
\t\t\t\treturn [
\t\t\t\t\t"NEXT REQUIRED ACTION: record the collected static trace as the baseline.",
\t\t\t\t\t`Use evidence_refs: ${JSON.stringify(refs)}`,
\t\t\t\t\t`Call ${TASK_VERIFICATION_TOOL_NAME} with:`,
\t\t\t\t\t`{"action":"record_baseline","baseline_method":"static_trace","hypothesis":"causal explanation supported by the inspected paths","conclusion":"what the two independent inspections prove","evidence_refs":${JSON.stringify(refs)},"unresolved_assumptions":[]}`,
\t\t\t\t].join("\n");
\t\t\t}

\t\t\tif (this.state.baseline.authorizedTestPaths.length > 0) {
\t\t\t\tif (!this.state.baseline.testSetupChanged) {
\t\t\t\t\treturn [
\t\t\t\t\t\t"NEXT REQUIRED ACTION: create or modify the authorized regression test before touching production code.",
\t\t\t\t\t\t`Only these paths are currently writable: ${this.state.baseline.authorizedTestPaths.join(", ")}.`,
\t\t\t\t\t\t"Then run a focused command targeting that exact test and confirm it fails for the intended behavioral reason.",
\t\t\t\t\t].join("\n");
\t\t\t\t}
\t\t\t\treturn [
\t\t\t\t\t"NEXT REQUIRED ACTION: run the authorized regression test in isolation and obtain a FAILED evidence handle.",
\t\t\t\t\t`Authorized test paths: ${this.state.baseline.authorizedTestPaths.join(", ")}.`,
\t\t\t\t\t"The command must target a specific test file or test name; a broad suite does not satisfy this baseline.",
\t\t\t\t\t"After the failing run, call action status again to receive the exact record_baseline payload.",
\t\t\t\t].join("\n");
\t\t\t}

\t\t\treturn [
\t\t\t\t"NEXT REQUIRED ACTION: establish the pre-change behavior before production mutation.",
\t\t\t\thighRisk
\t\t\t\t\t? "This lifecycle/durability task requires either a runtime reproduction or a failing focused regression test; static inspection is not accepted."
\t\t\t\t\t: "Use a runtime reproduction, a failing focused regression test, or two independent static inspection handles.",
\t\t\t\t`For a regression test, first call ${TASK_VERIFICATION_TOOL_NAME} with {"action":"authorize_baseline_test","test_paths":["exact/repository-relative.test.ts"]}.`,
\t\t\t\t"For runtime reproduction, run the concrete scenario now; its bash result will receive an evidence handle. Then call action status again.",
\t\t\t].join("\n");
\t\t}

\t\tif (this.state.mutationRevision === 0) {
\t\t\treturn [
\t\t\t\t"NEXT REQUIRED ACTION: implement the production change; the baseline gate is satisfied.",
\t\t\t\tthis.baselineReplayInstruction(),
\t\t\t\t"After the final production mutation, rerun the required behavior and call action status again before record_final.",
\t\t\t].join("\n");
\t\t}

\t\tif (
\t\t\tthis.state.final.status === "passed" &&
\t\t\tthis.state.final.verifiedMutationRevision === this.state.mutationRevision
\t\t) {
\t\t\treturn "NEXT REQUIRED ACTION: none. Final semantic verification is current; successful finish_work and git commit/push are unblocked.";
\t\t}

\t\tconst replayDescriptor = this.requiredBaselineReplayDescriptor();
\t\tconst replayEvidence = replayDescriptor
\t\t\t? this.findEvidence(
\t\t\t\t\t(item) =>
\t\t\t\t\t\titem.mutationRevision === this.state.mutationRevision &&
\t\t\t\t\t\titem.toolName === "bash" &&
\t\t\t\t\t\titem.descriptor === replayDescriptor,
\t\t\t\t)
\t\t\t: undefined;

\t\tif (replayEvidence?.isError) {
\t\t\treturn [
\t\t\t\t"NEXT REQUIRED ACTION: the required baseline replay still fails; repair the implementation before recording final success.",
\t\t\t\t`Failed replay command: ${replayEvidence.descriptor}`,
\t\t\t\t`Failed evidence: ${replayEvidence.ref} — ${replayEvidence.outputSummary || "no output summary"}`,
\t\t\t\t"After the next production mutation, rerun the same command and call action status again.",
\t\t\t].join("\n");
\t\t}

\t\tconst eligibleEvidence = replayEvidence ?? this.findEligibleFinalEvidence();
\t\tif (eligibleEvidence) {
\t\t\tconst method = this.finalMethodForEvidence(eligibleEvidence);
\t\t\treturn [
\t\t\t\t"NEXT REQUIRED ACTION: record final verification using the successful semantic evidence already collected for the current mutation revision.",
\t\t\t\t`Verified command or inspection: ${eligibleEvidence.descriptor}`,
\t\t\t\t`Use evidence_refs: ["${eligibleEvidence.ref}"]`,
\t\t\t\t`Call ${TASK_VERIFICATION_TOOL_NAME} with:`,
\t\t\t\t`{"action":"record_final","final_method":"${method}","final_status":"passed","expected_behavior":"the behavior that must now hold","observed_behavior":"what this evidence demonstrated","evidence_refs":["${eligibleEvidence.ref}"],"unresolved_failures":[]}`,
\t\t\t].join("\n");
\t\t}

\t\treturn [
\t\t\t"NEXT REQUIRED ACTION: collect fresh semantic evidence for the current mutation revision before completion.",
\t\t\tthis.baselineReplayInstruction(),
\t\t\t`Only evidence from mutation revision ${this.state.mutationRevision} is eligible.`,
\t\t\t"After the successful run, call action status again to receive the exact record_final payload and evidence handle.",
\t\t].join("\n");
\t}

\tprivate baselineReplayInstruction(): string {
\t\tconst descriptor = this.requiredBaselineReplayDescriptor();
\t\tif (!descriptor) return "Run a focused behavior-specific test or manual reproduction; generic lint/typecheck output is not sufficient.";
\t\treturn `Required exact replay command: ${descriptor}`;
\t}

\tprivate requiredBaselineReplayDescriptor(): string | undefined {
\t\tif (this.state.baseline.method === "runtime_reproduction") {
\t\t\treturn this.state.baseline.evidenceRefs
\t\t\t\t.map((ref) => this.evidence.get(ref))
\t\t\t\t.find((item) => item?.toolName === "bash" && !item.isError)?.descriptor;
\t\t}
\t\tif (this.state.baseline.method === "failing_regression_test") {
\t\t\treturn this.state.baseline.evidenceRefs
\t\t\t\t.map((ref) => this.evidence.get(ref))
\t\t\t\t.find((item) => item?.toolName === "bash" && item.isError && TEST_PATTERN.test(item.descriptor))?.descriptor;
\t\t}
\t\treturn undefined;
\t}

\tprivate findEligibleFinalEvidence(): TaskVerificationEvidence | undefined {
\t\tconst current = [...this.evidence.values()].filter(
\t\t\t(item) => item.mutationRevision === this.state.mutationRevision && !item.isError,
\t\t);
\t\treturn (
\t\t\tcurrent
\t\t\t\t.slice()
\t\t\t\t.reverse()
\t\t\t\t.find(
\t\t\t\t\t(item) =>
\t\t\t\t\t\titem.toolName === "bash" &&
\t\t\t\t\t\tTEST_PATTERN.test(item.descriptor) &&
\t\t\t\t\t\tFOCUSED_TEST_PATTERN.test(item.descriptor),
\t\t\t\t) ??
\t\t\tcurrent
\t\t\t\t.slice()
\t\t\t\t.reverse()
\t\t\t\t.find(
\t\t\t\t\t(item) =>
\t\t\t\t\t\titem.toolName === "bash" &&
\t\t\t\t\t\t!GENERIC_CHECK_PATTERN.test(item.descriptor) &&
\t\t\t\t\t\t!READ_ONLY_PATTERN.test(item.descriptor),
\t\t\t\t) ??
\t\t\tcurrent.slice().reverse().find((item) => STATIC_TOOLS.has(item.toolName))
\t\t);
\t}

\tprivate finalMethodForEvidence(evidence: TaskVerificationEvidence): FinalMethod {
\t\tif (evidence.toolName === "bash" && TEST_PATTERN.test(evidence.descriptor) && FOCUSED_TEST_PATTERN.test(evidence.descriptor)) {
\t\t\treturn "focused_test";
\t\t}
\t\tif (evidence.toolName === "bash") return "manual_reproduction";
\t\treturn "static_review";
\t}

\tprivate findEvidence(predicate: (evidence: TaskVerificationEvidence) => boolean): TaskVerificationEvidence | undefined {
\t\treturn [...this.evidence.values()].reverse().find(predicate);
\t}

\tprivate withGuidance(message: string): string {
\t\treturn `${message}\n\n${this.formatNextRequirement()}\n\nTo inspect the complete durable verification state at any time, call ${TASK_VERIFICATION_TOOL_NAME} with {"action":"status"}.`;
\t}

\tprivate blocked(message: string): BeforeToolCallResult {
\t\treturn { block: true, reason: this.withGuidance(message) };
\t}

'''.replace('\\t', '\t')
          text = text[:start] + replacement + text[end:]

          replace_once(
              '''\tprivate updated(message: string): VerificationResult {\n\t\treturn { status: "updated", message, state: this.currentState };\n\t}''',
              '''\tprivate updated(message: string, includeGuidance: boolean = true): VerificationResult {\n\t\treturn {\n\t\t\tstatus: "updated",\n\t\t\tmessage: includeGuidance ? `${message}\\n\\n${this.formatNextRequirement()}` : message,\n\t\t\tstate: this.currentState,\n\t\t};\n\t}''',
              "updated result",
          )

          path.write_text(text)

          test_path = Path("packages/coding-agent/test/task-verification.test.ts")
          tests = test_path.read_text()
          insertion = r'''
\tit("explains the exact next regression step proactively and in blocked gate errors", async () => {
\t\tconst { agent, controller } = createInstalledController();
\t\tawait callVerificationTool(controller, {
\t\t\taction: "declare_task",
\t\t\ttask_kind: "bug_fix",
\t\t\ttask_summary: "Fix completion regression after compaction",
\t\t});
\t\tawait callVerificationTool(controller, {
\t\t\taction: "authorize_baseline_test",
\t\t\ttest_paths: ["test/completion-compaction.test.ts"],
\t\t});

\t\tconst proactive = await callVerificationTool(controller, { action: "status" });
\t\texpect(proactive.text).toContain("NEXT REQUIRED ACTION");
\t\texpect(proactive.text).toContain("test/completion-compaction.test.ts");
\t\texpect(proactive.text).toContain("Only these paths are currently writable");

\t\tconst blocked = await beforeTool(agent, "edit", { path: "src/completion.ts", edits: [] });
\t\texpect(blocked?.block).toBe(true);
\t\texpect(blocked?.reason).toContain("NEXT REQUIRED ACTION");
\t\texpect(blocked?.reason).toContain("test/completion-compaction.test.ts");
\t\texpect(blocked?.reason).toContain('{"action":"status"}');
\t});

\tit("restores exact regression commands and repair payloads after session reconstruction", async () => {
\t\tconst sessionManager = SessionManager.inMemory();
\t\tconst firstAgent = new Agent();
\t\tconst first = createTaskVerificationController(sessionManager);
\t\tfirst.install(firstAgent);
\t\tawait callVerificationTool(first, {
\t\t\taction: "declare_task",
\t\t\ttask_kind: "bug_fix",
\t\t\ttask_summary: "Fix restored regression guidance",
\t\t});
\t\tawait callVerificationTool(first, {
\t\t\taction: "authorize_baseline_test",
\t\t\ttest_paths: ["test/restored-regression.test.ts"],
\t\t});
\t\tawait afterTool(firstAgent, "edit", {
\t\t\tpath: "test/restored-regression.test.ts",
\t\t\tedits: [{ oldText: "old", newText: "failing regression" }],
\t\t});
\t\tconst command = "vitest --run test/restored-regression.test.ts";
\t\tconst failedHandle = evidenceHandle(
\t\t\tawait afterTool(firstAgent, "bash", { command }, { isError: true, text: "expected failure" }),
\t\t);

\t\tconst restoredBaseline = createTaskVerificationController(sessionManager);
\t\tconst baselineStatus = await callVerificationTool(restoredBaseline, { action: "status" });
\t\texpect(baselineStatus.text).toContain(command);
\t\texpect(baselineStatus.text).toContain(failedHandle);
\t\texpect(baselineStatus.text).toContain('"baseline_method":"failing_regression_test"');

\t\tawait callVerificationTool(restoredBaseline, {
\t\t\taction: "record_baseline",
\t\t\tbaseline_method: "failing_regression_test",
\t\t\thypothesis: "The old behavior violates the completion contract",
\t\t\tconclusion: "The focused test reproduces the regression",
\t\t\tevidence_refs: [failedHandle],
\t\t\tunresolved_assumptions: [],
\t\t});
\t\tconst secondAgent = new Agent();
\t\trestoredBaseline.install(secondAgent);
\t\tawait afterTool(secondAgent, "edit", {
\t\t\tpath: "src/completion.ts",
\t\t\tedits: [{ oldText: "old", newText: "new" }],
\t\t});

\t\tconst restoredFinal = createTaskVerificationController(sessionManager);
\t\tconst finalStatus = await callVerificationTool(restoredFinal, { action: "status" });
\t\texpect(finalStatus.text).toContain(`Required exact replay command: ${command}`);
\t\texpect(finalStatus.text).toContain("mutation revision 1");

\t\tconst finalAgent = new Agent();
\t\trestoredFinal.install(finalAgent);
\t\tconst blockedFinish = await beforeTool(finalAgent, "finish_work", { status: "success" });
\t\texpect(blockedFinish?.reason).toContain(command);
\t\texpect(blockedFinish?.reason).toContain('{"action":"status"}');
\t});
'''.replace('\\t', '\t')
          anchor = "\n});\n"
          index = tests.rfind(anchor)
          if index < 0:
              raise SystemExit("test suite closing anchor not found")
          tests = tests[:index] + insertion + tests[index:]
          test_path.write_text(tests)
          PY

      - name: Add changelog and patch version
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("packages/coding-agent/CHANGELOG.md")
          text = path.read_text()
          anchor = "## [Unreleased]\n\n### Added\n"
          replacement = (
              "## [Unreleased]\n\n"
              "### Fixed\n\n"
              "- Make task-verification gates self-explanatory after compaction: expose exact next actions, eligible evidence, required replay commands, and ready-to-use verification payloads through proactive status and every rejection.\n\n"
              "### Added\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit(f"Expected one changelog anchor, found {text.count(anchor)}")
          path.write_text(text.replace(anchor, replacement, 1))
          PY
          node scripts/version-bump.mjs patch

      - name: Format and run focused tests
        run: |
          npm install --ignore-scripts
          npx biome check --write packages/coding-agent/src/core/task-verification.ts packages/coding-agent/test/task-verification.test.ts
          npm run build
          cd packages/coding-agent
          npx vitest run test/task-verification.test.ts

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(coding-agent): explain verification recovery steps"
          git push origin HEAD:fix/task-verification-guidance
