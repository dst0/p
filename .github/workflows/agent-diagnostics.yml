name: Agent cleanup generated fixes

on:
  push:
    branches:
      - agent/fix-reinstall-indexing-hang

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/fix-reinstall-indexing-hang
          fetch-depth: 0

      - name: Remove unrelated formatter output and temporary workflow
        run: |
          git checkout origin/main -- \
            packages/coding-agent/src/core/indexing-daemon.ts \
            packages/coding-agent/test/indexing-reinstall-lifecycle.test.ts \
            packages/coding-agent/test/indexing-reinstall-ui.test.ts \
            packages/coding-agent/test/task-verification-session-services.test.ts
          git rm .github/workflows/agent-diagnostics.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary diagnostics and unrelated formatting"
          git push origin HEAD:agent/fix-reinstall-indexing-hang
