name: Agent apply generated fixes

on:
  push:
    branches:
      - agent/fix-reinstall-indexing-hang

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/fix-reinstall-indexing-hang

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply formatter and generated shrinkwrap
        run: |
          npx biome check --write .
          node scripts/generate-coding-agent-shrinkwrap.mjs

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "chore(coding-agent): apply check fixes and refresh shrinkwrap"
          git push origin HEAD:agent/fix-reinstall-indexing-hang
