name: Agent diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Capture repository check output
        run: |
          set +e
          npm run check > agent-check.log 2>&1
          echo "$?" > agent-check-exit.txt
          set -e

      - name: Generate coding-agent shrinkwrap
        run: |
          node scripts/generate-coding-agent-shrinkwrap.mjs
          cp packages/coding-agent/npm-shrinkwrap.json agent-generated-npm-shrinkwrap.json

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: agent-diagnostics
          path: |
            agent-check.log
            agent-check-exit.txt
            agent-generated-npm-shrinkwrap.json
          if-no-files-found: error
