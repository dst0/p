name: Apply state reminder fix

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

concurrency:
  group: apply-state-reminder-fix
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/clarify-session-state-reminder'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply source, regression, and changelog changes
        run: python3 scripts/apply-state-reminder-fix.py

      - name: Bump lockstep patch version
        run: |
          node scripts/version-bump.mjs patch
          node scripts/generate-coding-agent-shrinkwrap.mjs

      - name: Run focused session-state regression suite
        working-directory: packages/coding-agent
        run: node ../../node_modules/vitest/dist/cli.js --run test/suite/agent-session-state-update-tool.test.ts

      - name: Run repository checks
        run: npm run check

      - name: Reinstall and smoke the CLI
        run: |
          ./reinstall.sh
          p --version

      - name: Validate patch and commit final changes
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-state-reminder-fix.yml scripts/apply-state-reminder-fix.py
          git add packages/coding-agent/src/core/agent-session.ts
          git add packages/coding-agent/test/suite/agent-session-state-update-tool.test.ts
          git add packages/coding-agent/CHANGELOG.md
          git add package.json package-lock.json packages/agent/package.json packages/ai/package.json packages/code-index/package.json packages/coding-agent/package.json packages/tui/package.json
          git add packages/coding-agent/examples/extensions/with-deps/package.json
          git add packages/coding-agent/examples/extensions/custom-provider-anthropic/package.json
          git add packages/coding-agent/examples/extensions/custom-provider-gitlab-duo/package.json
          git add packages/coding-agent/examples/extensions/sandbox/package.json
          git add packages/coding-agent/npm-shrinkwrap.json
          git status --short
          git commit -m "fix(coding-agent): clarify session-state reminder timing"
          git push origin HEAD
