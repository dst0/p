name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    runs-on: [self-hosted, Linux, X64, mini-pc, p]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: fix/task-verification-guidance
          fetch-depth: 0

      - name: Apply pending task-verification guidance patch
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/task-verification-guidance'
        run: |
          if [[ -f .patch-error.txt ]]; then
            cat .patch-error.txt
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/temp-task-verification-guidance.yml').read_text().splitlines()
          targets = [
              'Apply task-verification guidance changes',
              'Add changelog and patch version',
              'Format and run focused tests',
          ]

          for target in targets:
              marker = f'      - name: {target}'
              try:
                  start = workflow.index(marker)
              except ValueError as error:
                  raise SystemExit(f'Missing temporary workflow step: {target}') from error
              run_index = next(
                  index for index in range(start + 1, len(workflow)) if workflow[index] == '        run: |'
              )
              lines = []
              for line in workflow[run_index + 1:]:
                  if line.startswith('      - name:'):
                      break
                  if line and not line.startswith('          '):
                      raise SystemExit(f'Unexpected indentation in temporary workflow step {target}: {line!r}')
                  lines.append(line[10:] if line else '')
              script = '\n'.join(lines) + '\n'
              result = subprocess.run(
                  ['bash', '-euxo', 'pipefail', '-c', script],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              print(result.stdout, end='')
              if result.returncode != 0:
                  Path('.patch-error.txt').write_text(
                      f'Failed temporary step: {target}\nExit code: {result.returncode}\n\n{result.stdout}'
                  )
                  subprocess.run(['git', 'add', '.patch-error.txt'], check=True)
                  subprocess.run(['git', 'commit', '-m', 'chore: capture task verification patch failure'], check=True)
                  subprocess.run(
                      ['git', 'push', 'origin', 'HEAD:fix/task-verification-guidance'],
                      check=True,
                  )
                  raise SystemExit(result.returncode)
          PY
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/temp-task-verification-guidance.yml .patch-error.txt
          git add -A
          git commit -m "fix(coding-agent): explain verification recovery steps"
          git push origin HEAD:fix/task-verification-guidance

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -sf "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: |
          mkdir -p "$RUNNER_TEMP/p-ci-home"
          HOME="$RUNNER_TEMP/p-ci-home" ./test.sh
