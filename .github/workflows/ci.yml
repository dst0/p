name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    runs-on: [self-hosted, Linux, X64, mini-pc, p]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: fix/task-verification-guidance
          fetch-depth: 0

      - name: Regenerate versioned shrinkwrap
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/task-verification-guidance'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm ci --ignore-scripts
          npm run shrinkwrap:coding-agent
          git checkout origin/main -- .github/workflows/ci.yml
          git add packages/coding-agent/npm-shrinkwrap.json .github/workflows/ci.yml
          git commit -m "chore(coding-agent): refresh 0.4.45 shrinkwrap"
          git push origin HEAD:fix/task-verification-guidance

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -sf "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: |
          mkdir -p "$RUNNER_TEMP/p-ci-home"
          HOME="$RUNNER_TEMP/p-ci-home" ./test.sh
