name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    runs-on: [self-hosted, Linux, X64, mini-pc, p]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -sf "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: |
          mkdir -p "$RUNNER_TEMP/p-ci-home"
          HOME="$RUNNER_TEMP/p-ci-home" ./test.sh

      - name: Coverage (99% changed lines)
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p "$RUNNER_TEMP/p-ci-coverage-home"
          HOME="$RUNNER_TEMP/p-ci-coverage-home" ./test.sh test:coverage
          npm run test:coverage:check -- --base "$COVERAGE_BASE_SHA"

      - name: Upload coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: |
            packages/*/coverage/lcov.info
            packages/*/coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 14
