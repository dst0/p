name: Apply release changelog fix

on:
  push:
    branches:
      - agent/fix-release-changelog-order

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-release-changelog-order
          fetch-depth: 0

      - name: Apply anchored edits
        run: |
          cat > /tmp/apply-release-fix.mjs <<'EOF'
          import { readFileSync, writeFileSync, unlinkSync } from "node:fs";

          function replaceExact(path, before, after) {
            const content = readFileSync(path, "utf8");
            if (!content.includes(before)) {
              throw new Error(`Expected anchored text not found in ${path}`);
            }
            writeFileSync(path, content.replace(before, after));
          }

          replaceExact(
            "packages/agent/CHANGELOG.md",
            `## [0.4.40] - 2026-07-24

## [0.4.41] - 2026-07-23

### Fixed

- Validate \`finish_work\` payloads in the completion protocol: reject empty summaries and block \`status: 'success'\` with non-empty \`remaining_work\`.
`,
            `## [0.4.41] - 2026-07-23

### Fixed

- Validate \`finish_work\` payloads in the completion protocol: reject empty summaries and block \`status: 'success'\` with non-empty \`remaining_work\`.

## [0.4.40] - 2026-07-24
`,
          );

          replaceExact(
            "packages/coding-agent/CHANGELOG.md",
            `## [Unreleased]

## [0.4.40] - 2026-07-24

### Added

- Auto-reconcile session state when the agent calls \`finish_work(status: 'success')\`: automatically transition \`not_started\` and \`in_progress\` plan items to \`done\` so the consistency gate passes without a protocol-repair turn.
- Strengthen system prompt completion protocol: require the agent to examine \`<working_state>\` before calling \`finish_work\`, verify all plan items are genuinely done, complete remaining work if not, and repeat until all tasks are complete before calling \`finish_work\` with status \`success\`.

## [0.4.41] - 2026-07-23

### Fixed

- Fix \`finish_work\` reconciliation timing: auto-reconcile only after confirming the next tool call is not an error, so validation failures preserve plan state for agent repair.
`,
            `## [Unreleased]

### Fixed

- Validate changelog structure before release, require descending release versions, and document UTC release dates.

## [0.4.41] - 2026-07-23

### Fixed

- Fix \`finish_work\` reconciliation timing: auto-reconcile only after confirming the next tool call is not an error, so validation failures preserve plan state for agent repair.

## [0.4.40] - 2026-07-24

### Added

- Auto-reconcile session state when the agent calls \`finish_work(status: 'success')\`: automatically transition \`not_started\` and \`in_progress\` plan items to \`done\` so the consistency gate passes without a protocol-repair turn.
- Strengthen system prompt completion protocol: require the agent to examine \`<working_state>\` before calling \`finish_work\`, verify all plan items are genuinely done, complete remaining work if not, and repeat until all tasks are complete before calling \`finish_work\` with status \`success\`.
`,
          );

          replaceExact(
            "AGENTS.md",
            `- All new entries go under \`## [Unreleased]\`. Read the full section first and append to existing subsections; never duplicate them.
- Released version sections (e.g. \`## [0.12.2]\`) are immutable; never modify them.
`,
            `- \`## [Unreleased]\` must appear exactly once and must be the first level-two section immediately after \`# Changelog\`.
- All new entries go under \`## [Unreleased]\`. Read the full section first and append to existing subsections; never duplicate them.
- Released version sections must remain in strictly descending semantic-version order directly below \`[Unreleased]\`.
- Release dates use the UTC calendar date in \`YYYY-MM-DD\` format, derived from \`new Date().toISOString().slice(0, 10)\`; never substitute a local timezone date.
- Released version sections (e.g. \`## [0.12.2]\`) are immutable except when correcting ordering or release metadata errors; never move entries between released versions.
`,
          );

          replaceExact(
            "AGENTS.md",
            `1. **Update CHANGELOGs**: ask the user whether they ran the \`/cl\` prompt on the latest commit on \`main\`. If not, they must run \`/cl\` first to audit and update each package's \`[Unreleased]\` section before releasing.
`,
            `1. **Update and validate CHANGELOGs**: ask the user whether they ran the \`/cl\` prompt on the latest commit on \`main\`. If not, they must run \`/cl\` first to audit and update each package's \`[Unreleased]\` section before releasing. Before any version bump, verify every changelog has exactly one topmost \`[Unreleased]\` section, released versions are strictly descending, and all release dates are UTC dates.
`,
          );

          replaceExact(
            "scripts/release.mjs",
            `const SEMVER_RE = /^\\d+\\.\\d+\\.\\d+$/;
`,
            `const SEMVER_RE = /^\\d+\\.\\d+\\.\\d+$/;
const CHANGELOG_HEADER = "# Changelog\\n\\n## [Unreleased]\\n\\n";
const RELEASE_HEADING_RE = /^## \\[(\\d+\\.\\d+\\.\\d+)\\] - (\\d{4}-\\d{2}-\\d{2})$/gm;
`,
          );

          replaceExact(
            "scripts/release.mjs",
            `function getChangelogs() {
`,
            `function getUtcDate() {
\treturn new Date().toISOString().slice(0, 10);
}

function getChangelogs() {
`,
          );

          replaceExact(
            "scripts/release.mjs",
            `function updateChangelogsForRelease(version) {
\tconst date = new Date().toISOString().split("T")[0];
\tconst changelogs = getChangelogs();

\tfor (const changelog of changelogs) {
\t\tconst content = readFileSync(changelog, "utf-8");

\t\tif (!content.includes("## [Unreleased]")) {
\t\t\tconsole.log(\`  Skipping \${changelog}: no [Unreleased] section\`);
\t\t\tcontinue;
\t\t}

\t\tconst updated = content.replace(
\t\t\t"## [Unreleased]",
\t\t\t\`## [\${version}] - \${date}\`
\t\t);
`,
            `function validateChangelogs() {
\tfor (const changelog of getChangelogs()) {
\t\tconst content = readFileSync(changelog, "utf-8");
\t\tconst unreleasedCount = content.match(/^## \\[Unreleased\\]$/gm)?.length ?? 0;
\t\tif (unreleasedCount !== 1 || !content.startsWith(CHANGELOG_HEADER)) {
\t\t\tthrow new Error(\`\${changelog}: [Unreleased] must appear exactly once as the first section after # Changelog\`);
\t\t}

\t\tconst versions = [...content.matchAll(RELEASE_HEADING_RE)].map((match) => match[1]);
\t\tfor (let index = 1; index < versions.length; index++) {
\t\t\tif (compareVersions(versions[index - 1], versions[index]) <= 0) {
\t\t\t\tthrow new Error(\`\${changelog}: released versions must be strictly descending (\${versions[index - 1]} before \${versions[index]})\`);
\t\t\t}
\t\t}
\t}
}

function updateChangelogsForRelease(version) {
\tconst date = getUtcDate();
\tconst changelogs = getChangelogs();

\tfor (const changelog of changelogs) {
\t\tconst content = readFileSync(changelog, "utf-8");
\t\tconst updated = content.replace(
\t\t\tCHANGELOG_HEADER,
\t\t\t\`# Changelog\\n\\n## [\${version}] - \${date}\\n\\n\`,
\t\t);
`,
          );

          replaceExact(
            "scripts/release.mjs",
            `// 2. Bump or set version
const version = bumpOrSetVersion(RELEASE_TARGET);
`,
            `// 2. Validate changelogs before mutating versions
console.log("Validating changelogs...");
validateChangelogs();
console.log("  Changelog structure valid\\n");

// 3. Bump or set version
const version = bumpOrSetVersion(RELEASE_TARGET);
`,
          );

          replaceExact("scripts/release.mjs", "// 3. Update changelogs", "// 4. Update changelogs");
          replaceExact("scripts/release.mjs", "// 4. Regenerate release artifacts", "// 5. Regenerate release artifacts");
          replaceExact("scripts/release.mjs", "// 5. Run checks", "// 6. Run checks");
          replaceExact("scripts/release.mjs", "// 6. Commit and tag", "// 7. Commit and tag");
          replaceExact("scripts/release.mjs", "// 7. Add new [Unreleased] sections", "// 8. Add new [Unreleased] sections");
          replaceExact("scripts/release.mjs", "// 8. Commit", "// 9. Commit");
          replaceExact("scripts/release.mjs", "// 9. Push", "// 10. Push");

          unlinkSync(".github/workflows/apply-release-changelog-fix.yml");
          EOF
          node /tmp/apply-release-fix.mjs

      - name: Validate edits
        run: |
          node --check scripts/release.mjs
          node - <<'EOF'
          const { readFileSync } = require('node:fs');
          for (const path of ['packages/agent/CHANGELOG.md', 'packages/coding-agent/CHANGELOG.md']) {
            const content = readFileSync(path, 'utf8');
            if (!content.startsWith('# Changelog\n\n## [Unreleased]\n\n## [0.4.41] - 2026-07-23')) {
              throw new Error(`${path}: corrected release order missing`);
            }
          }
          EOF

      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AGENTS.md scripts/release.mjs packages/agent/CHANGELOG.md packages/coding-agent/CHANGELOG.md .github/workflows/apply-release-changelog-fix.yml
          git commit -m "fix: validate release changelog structure"
          git push origin HEAD:agent/fix-release-changelog-order
